# C1 单机后端、MySQL 和 Redis。MySQL 与后端默认只对本机开放。
name: ooad-rbac-c1

services:
  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_DATABASE: ooad_rbac0
      MYSQL_USER: rbac
      MYSQL_PASSWORD: ${RBAC_DB_PASSWORD:?Set RBAC_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -Nse 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ../backend
      dockerfile: ../部署运行说明/Dockerfile
      args:
        MAVEN_IMAGE: ${RBAC_MAVEN_IMAGE:-maven:3.9.11-eclipse-temurin-21}
        JAVA_IMAGE: ${RBAC_JAVA_IMAGE:-eclipse-temurin:21-jre-noble}
    environment:
      RBAC_DB_URL: jdbc:mysql://mysql:3306/ooad_rbac0
      RBAC_DB_USER: rbac
      RBAC_DB_PASSWORD: ${RBAC_DB_PASSWORD:?Set RBAC_DB_PASSWORD in .env}
      RBAC_REDIS_HOST: redis
      RBAC_REDIS_PORT: "6379"
      RBAC_SESSION_SECURE: ${RBAC_SESSION_SECURE:-false}
      RBAC_LOG_API: INFO
      RBAC_LOG_SERVICE: INFO
      RBAC_LOG_INFRASTRUCTURE: INFO
    ports:
      - "127.0.0.1:${RBAC_HTTP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 未登录返回 401，检查应用已经能够处理 HTTP 请求。
      test: ["CMD-SHELL", "test \"$$(curl --silent --show-error --noproxy '*' --output /dev/null --write-out '%{http_code}' --max-time 3 http://127.0.0.1:8080/api/auth/me)\" = 401"]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

volumes:
  mysql-data:
  redis-data:
