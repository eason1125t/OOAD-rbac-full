# C1 首批接口主契约。验收步骤见同目录的首批接口验收.md。
openapi: "3.0.3"
info:
  title: "OOAD RBAC · C1 首批接口"
  version: "1.0.0"
  description: "RBAC0 登录会话、模拟审批、授撤权、组织权限策略及管理维护。"
servers:
  - url: "http://localhost:8080"
    description: "C1 本地调试"
tags:
  - name: "登录与会话"
  - name: "业务模拟"
  - name: "授权配置"
security:
  - SessionCookie: []
paths:
  "/api/auth/csrf":
    get:
      operationId: "getCsrf"
      tags:
        - "登录与会话"
      summary: "获取 CSRF 令牌"
      description: "登录前可调用。保留匿名会话 Cookie，登录成功后重新获取令牌。"
      security: []
      responses:
        "200":
          description: "返回当前会话的令牌"
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/auth/login":
    post:
      operationId: "login"
      tags:
        - "登录与会话"
      summary: "登录"
      description: "提交匿名会话的 CSRF 令牌及 JSON 凭据。成功时轮换会话 ID，旧令牌失效。账号不存在、密码错误、待匹配或停用均返回相同错误。"
      security: []
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "登录成功，返回身份与工作区"
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BadLogin"
        "403":
          $ref: "#/components/responses/Csrf"
        "415":
          $ref: "#/components/responses/MediaType"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/auth/me":
    get:
      operationId: "getCurrentSession"
      tags:
        - "登录与会话"
      summary: "查询当前身份与工作区"
      description: "每次按最新组织和授权状态查询，当前账号来自会话。"
      responses:
        "200":
          description: "当前身份与导航信息"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "401":
          $ref: "#/components/responses/NoSession"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/auth/logout":
    post:
      operationId: "logout"
      tags:
        - "登录与会话"
      summary: "退出登录"
      description: "注销 Redis 会话并清除 SESSION Cookie。CSRF 校验先失败时返回 403。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "退出成功"
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Csrf"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/business-systems":
    get:
      operationId: "listBusinessSystems"
      tags:
        - "业务模拟"
      summary: "查询可进入的业务系统"
      description: "按当前身份筛选系统。没有可进入的系统时返回空数组。"
      responses:
        "200":
          description: "可进入的系统列表"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/BusinessSystem"
        "401":
          $ref: "#/components/responses/NoSession"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/business-systems/{systemCode}/requests":
    parameters:
      - $ref: "#/components/parameters/SystemCode"
    get:
      operationId: "listSystemRequests"
      tags:
        - "业务模拟"
      summary: "查询系统申请"
      description: "通过系统准入后可查询该系统的模拟申请。按申请 ID 升序分页。"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "模拟申请分页"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/RequestPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/BusinessForbidden"
        "404":
          $ref: "#/components/responses/MissingSystem"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/requests/{requestId}/approve":
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: "approveRequest"
      tags:
        - "业务模拟"
      summary: "审批模拟申请"
      description: "从申请记录确定所属系统，检查系统准入、组织停用和该系统的 request:approve 权限。超级管理员默认具有仍开放的权限。仅待审批申请可提交更新。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: "鉴权通过且审批成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApprovalResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ApprovalForbidden"
        "404":
          $ref: "#/components/responses/MissingRequest"
        "409":
          $ref: "#/components/responses/ApprovalConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/employees/{employeeId}/roles/{roleId}":
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
      - $ref: "#/components/parameters/RoleId"
    put:
      operationId: "grantEmployeeRole"
      tags:
        - "授权配置"
      summary: "授予员工角色"
      description: "要求 employee-role:write。Service 检查管理准入、范围及关系两端。关系已存在时允许幂等重试；待匹配或停用员工、已停用权限不能新增相应分配。提交成功后响应。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "关系已建立"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "409":
          $ref: "#/components/responses/AssignmentConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: "revokeEmployeeRole"
      tags:
        - "授权配置"
      summary: "撤销员工角色"
      description: "要求 employee-role:write。Service 检查管理准入、范围及关系两端。两端存在且关系已移除时允许幂等重试。提交成功后响应。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "关系已撤销"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/roles/{roleId}/permissions/{permissionId}":
    parameters:
      - $ref: "#/components/parameters/RoleId"
      - $ref: "#/components/parameters/PermissionId"
    put:
      operationId: "grantRolePermission"
      tags:
        - "授权配置"
      summary: "授予角色权限"
      description: "要求 role-permission:write。Service 检查管理准入、范围及关系两端。关系已存在时允许幂等重试；待匹配或停用员工、已停用权限不能新增相应分配。提交成功后响应。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "关系已建立"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "409":
          $ref: "#/components/responses/AssignmentConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: "revokeRolePermission"
      tags:
        - "授权配置"
      summary: "撤销角色权限"
      description: "要求 role-permission:write。Service 检查管理准入、范围及关系两端。两端存在且关系已移除时允许幂等重试。提交成功后响应。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "关系已撤销"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/organizations/{organizationId}/business-systems/{systemCode}/permissions/{permissionCode}/disabled":
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/SystemCode"
      - $ref: "#/components/parameters/PermissionCode"
    put:
      operationId: "disableOrganizationPermission"
      tags:
        - "授权配置"
      summary: "停用组织动作"
      description: "仅超级管理员可操作。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "操作已提交，重复提交幂等"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: "reopenOrganizationPermission"
      tags:
        - "授权配置"
      summary: "重新开放组织动作"
      description: "仅超级管理员可操作。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "操作已提交，重复提交幂等"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/organizations/{organizationId}/business-systems/{systemCode}/permissions/{permissionCode}/regrants/{roleId}":
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/SystemCode"
      - $ref: "#/components/parameters/PermissionCode"
      - $ref: "#/components/parameters/RoleId"
    put:
      operationId: "regrantOrganizationPermission"
      tags:
        - "授权配置"
      summary: "按角色重授组织动作"
      description: "仅超级管理员可操作。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "操作已提交，重复提交幂等"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "409":
          $ref: "#/components/responses/AssignmentConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/employees":
    post:
      operationId: "createManagementEmployee"
      tags: ["授权配置"]
      summary: "新增员工"
      description: "按当前管理员的组织范围创建员工资料。登录凭据单独配置。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ManagementEmployeeCreate"
      responses:
        "201":
          description: "资源资料"
          headers:
            Location:
              schema: {type: "string"}
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ManagementEmployee"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ManagementWriteForbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "409":
          $ref: "#/components/responses/ManagementConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: "listManagementEmployees"
      tags: ["授权配置"]
      summary: "查看范围内员工及原表字段"
      description: "限当前管理员的可见范围，结果按 ID 升序，total 为范围内总数。"
      parameters:
        - $ref: "#/components/parameters/ManagementPageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "管理员可见结果"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ManagementEmployeePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ManagementReadForbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/companies":
    get:
      operationId: "listManagementCompanies"
      tags: ["授权配置"]
      summary: "查询公司目录"
      description: "限当前管理员的可见范围，结果按 ID 升序，total 为范围内总数。"
      parameters:
        - $ref: "#/components/parameters/ManagementPageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "管理员可见结果"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ManagementOrganizationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ManagementReadForbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/departments":
    get:
      operationId: "listManagementDepartments"
      tags: ["授权配置"]
      summary: "查询部门原表三列及正式组织引用"
      description: "含原表中归类为公司的组织行和演示部门。按管理员可见范围分页，total 为范围内总数。"
      parameters:
        - $ref: "#/components/parameters/ManagementPageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "管理员可见结果"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ManagementOrganizationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ManagementReadForbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/roles":
    post:
      operationId: "createManagementRole"
      tags: ["授权配置"]
      summary: "新增角色"
      description: "按组织范围新增角色。空归属表示全局共享，仅超级管理员可创建。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ManagementRoleCreate"
      responses:
        "201":
          description: "资源资料"
          headers:
            Location:
              schema: {type: "string"}
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ManagementRole"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ManagementWriteForbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "409":
          $ref: "#/components/responses/ManagementConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: "listManagementRoles"
      tags: ["授权配置"]
      summary: "查询角色定义"
      description: "限当前管理员的可见范围，结果按 ID 升序，total 为范围内总数。"
      parameters:
        - $ref: "#/components/parameters/ManagementPageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "管理员可见结果"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ManagementRolePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ManagementReadForbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/permissions":
    post:
      operationId: "createManagementPermission"
      tags: ["授权配置"]
      summary: "新增权限"
      description: "新增运行时权限。系统及权限码确定权限身份，全局定义仅超级管理员可创建。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ManagementPermissionCreate"
      responses:
        "201":
          description: "资源资料"
          headers:
            Location:
              schema: {type: "string"}
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ManagementPermission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ManagementWriteForbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "409":
          $ref: "#/components/responses/ManagementConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: "listManagementPermissions"
      tags: ["授权配置"]
      summary: "查询运行时权限定义"
      description: "限当前管理员的可见范围，结果按 ID 升序，total 为范围内总数。"
      parameters:
        - $ref: "#/components/parameters/ManagementPageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "管理员可见结果"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ManagementPermissionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ManagementReadForbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/catalog-entries":
    get:
      operationId: "listManagementCatalog"
      tags: ["授权配置"]
      summary: "查询 Excel 功能权限清单"
      description: "限当前管理员的可见范围，结果按 ID 升序，total 为范围内总数。"
      parameters:
        - $ref: "#/components/parameters/ManagementPageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "管理员可见结果"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ManagementCatalogPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ManagementReadForbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/employees/{employeeId}/roles":
    get:
      operationId: "listManagementEmployeeRoles"
      tags: ["授权配置"]
      summary: "查询员工已分配角色"
      description: "限当前管理员的可见范围，结果按 ID 升序，total 为范围内总数。"
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
        - $ref: "#/components/parameters/ManagementPageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "管理员可见结果"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ManagementRolePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ManagementReadForbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/roles/{roleId}/permissions":
    get:
      operationId: "listManagementRolePermissions"
      tags: ["授权配置"]
      summary: "查询角色已分配权限"
      description: "限当前管理员的可见范围，结果按 ID 升序，total 为范围内总数。"
      parameters:
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/ManagementPageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "管理员可见结果"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ManagementPermissionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
