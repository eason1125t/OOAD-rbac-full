  <text x="630" y="44" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="central">RBAC0 组织与授权范围 · 陈氏 ER 图</text>
  <text x="630" y="96" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="central">组织归属</text>
  <text x="145" y="195" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">员工</text>
  <text x="630" y="195" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">组织</text>
  <text x="1115" y="195" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">业务系统</text>
  <text x="387" y="195" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">归属</text>
  <text x="243" y="175" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">N</text>
