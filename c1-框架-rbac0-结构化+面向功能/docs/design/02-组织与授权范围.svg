  <text x="872" y="195" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">拥有系统</text>
  <text x="728" y="175" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="1017" y="175" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">N</text>
  <text x="555" y="130" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central">组织 ID</text>
  <text x="705" y="130" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central">组织类型</text>
  <text x="630" y="288" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">上下级</text>
  <text x="540" y="254" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">N 下级</text>
  <text x="820" y="258" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">1 上级</text>
  <text x="630" y="351" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central">公司为根，部门属于一家分公司。待匹配员工可暂缺归属。</text>
  <text x="630" y="412" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="central">管理范围与定义归属</text>
  <text x="145" y="501" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">员工</text>
  <text x="630" y="501" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">组织</text>
  <text x="1115" y="501" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">角色</text>
  <text x="387" y="501" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">管理范围</text>
  <text x="243" y="481" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">N</text>
  <text x="532" y="481" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="872" y="501" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">拥有角色</text>
  <text x="728" y="481" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="1017" y="481" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">N</text>
  <text x="630" y="566" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central">普通员工可无管理范围，超级管理员使用全局范围。全局角色可无所属组织。</text>
  <text x="630" y="634" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="central">按系统定义权限，按组织开放或停用</text>
  <text x="145" y="741" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">业务系统</text>
  <text x="630" y="741" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">权限</text>
  <text x="1115" y="741" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">组织</text>
  <text x="387" y="741" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">定义权限</text>
  <text x="243" y="721" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="532" y="721" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">N</text>
  <text x="872" y="741" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">配置权限</text>
  <text x="728" y="721" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">M</text>
  <text x="1017" y="721" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">N</text>
  <text x="872" y="675" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central">开放／停用</text>
  <text x="630" y="810" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central">管理权限可无业务系统。同一系统内权限码唯一。</text>
  <text x="630" y="873" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="central">权限定义归属</text>
  <text x="368" y="950" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">组织</text>
  <text x="890" y="950" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">权限</text>
  <text x="629" y="950" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">拥有定义</text>
  <text x="466" y="930" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="792" y="930" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">N</text>
  <text x="630" y="1018" fill="#24384a" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central">全局权限可无所属组织。组织停用优先于角色授权。</text>
</svg>