# 八项身份能力验收快照；正式全集以openapi.yaml为准。
openapi: 3.0.3
info:
  title: C2 统一身份鉴权八项能力 · 后端验收快照
  version: 2.5.0
  description: 八项统一身份能力的当前后端验收快照；JWT认证已接入，刷新辅助入口见主OpenAPI，不表示前端或集群已验收。
x-implementation-status: implemented
servers:
- url: /func
  description: 面向功能版
- url: /oo
  description: 面向对象版
tags:
- name: 统一身份鉴权
security:
- BearerAuth: []
paths:
  /api/auth/login:
    post:
      operationId: login
      tags:
      - 身份与认证
      summary: 登录
      description: 账号密码与Cookie CSRF校验成功后，返回身份/工作区及访问JWT，并设置HttpOnly刷新Cookie。成功替换当前浏览器旧登录；失败不撤销已有登录。
      security:
      - FuncCsrfCookie: []
      - OoCsrfCookie: []
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: example-user
              password: example-password
      responses:
        '200':
          description: 身份/工作区及15分钟内访问JWT；刷新凭证仅通过Cookie交付。
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                employee:
                  id: 101
                  username: example-user
                  name: 示例员工
                  organizationId: 2
                workspaces: []
                defaultWorkspaceKey: null
                accessToken: <signed-access-jwt>
                tokenType: Bearer
                expiresIn: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/BadLogin'
        '403':
          $ref: '#/components/responses/Csrf'
        '415':
          $ref: '#/components/responses/MediaType'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-implementation-status: implemented
  /api/auth/logout:
    post:
      operationId: logout
      tags:
      - 身份与认证
      summary: 退出登录
      description: Cookie CSRF通过后撤销当前刷新凭证对应的独立sid，清除认证Cookie。无需有效访问JWT；无/未知刷新Cookie幂等204，不影响其他浏览器或另一版。认证存储故障503。
      parameters:
      - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: 退出成功
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '403':
          $ref: '#/components/responses/Csrf'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - FuncCsrfCookie: []
      - OoCsrfCookie: []
      x-implementation-status: implemented
  /api/auth/me:
    get:
      operationId: getCurrentSession
      tags:
      - 身份与认证
      summary: 查询当前员工、工作区及可选系统角色与权限
      description: 省略systemCode保留旧响应；提供后增加authorization。角色来源与有效权限分开，直接和继承可同时成立。身份仅来自已验证Bearer JWT和Redis登录记录。
      responses:
        '200':
          description: 当前身份；有systemCode时包含授权信息。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSessionResult'
              examples:
                withoutSystem:
                  value:
                    employee:
                      id: 101
                      username: engineering-employee
                      name: 示例员工
                      organizationId: 2
                    workspaces:
                    - key: business:demo-engineering-app
                      type: BUSINESS
                      name: 示例工程申请系统
                      path: /business/demo-engineering-app/
                    defaultWorkspaceKey: business:demo-engineering-app
                withSystem:
                  value:
                    employee:
                      id: 101
                      username: engineering-employee
                      name: 示例员工
                      organizationId: 2
                    workspaces:
                    - key: business:demo-engineering-app
                      type: BUSINESS
                      name: 示例工程申请系统
                      path: /business/demo-engineering-app/
                    defaultWorkspaceKey: business:demo-engineering-app
                    authorization:
                      systemCode: demo-engineering-app
                      roles:
                      - id: 10
                        name: 示例高级角色
                        direct: true
                        inherited: false
                        inheritedFromRoleIds: []
                        appliesToSystem: true
                      - id: 11
                        name: 示例基础角色
                        direct: false
                        inherited: true
                        inheritedFromRoleIds:
                        - 10
                        appliesToSystem: true
                      effectivePermissions:
                      - id: 20
                        code: request:read
                        name: 查看申请
                      globalAdministrator: false
        '401':
          $ref: '#/components/responses/NoSession'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CurrentSystemForbidden'
        '404':
          $ref: '#/components/responses/MissingSystem'
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/OptionalIdentitySystemCode'
  /api/departments:
    get:
      operationId: listManagementDepartments
      tags:
      - 授权配置
      summary: 查询原表目录或逐层展开正式组织树
      description: 默认directory仅管理员，保留原表公司行；tree按用户范围查询COMPANY/DEPARTMENT。parentId与rootsOnly不得同传；directory不接受二者。仅q搜索可见节点，parentId+q只搜子级，rootsOnly=true+q只搜根。hasChildren只计算可见子级。
      parameters:
      - $ref: '#/components/parameters/DirectoryView'
      - $ref: '#/components/parameters/DirectoryParent'
      - $ref: '#/components/parameters/DirectoryRoots'
      - $ref: '#/components/parameters/DirectoryKeyword'
      - $ref: '#/components/parameters/ManagementPageNumber'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 投影由view确定；列表和total使用相同范围。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDirectoryResult'
              examples:
                tree:
                  value:
                    items:
                    - id: 2
                      code: demo-engineering
                      name: 示例工程部
                      parentId: 1
                      organizationType: DEPARTMENT
                      hasChildren: false
                    page: 1
                    pageSize: 20
                    total: 1
                directory:
                  value:
                    items:
                    - id: 2
                      code: demo-engineering
                      name: 示例工程部
                      parentId: 1
                      managerName: null
                      sourceParentName: null
                    page: 1
                    pageSize: 20
                    total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NoSession'
        '403':
          $ref: '#/components/responses/DirectoryReadForbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/MissingResource'
      x-implementation-status: implemented
  /api/employees:
    get:
      operationId: listManagementEmployees
      tags:
      - 授权配置
      summary: 按可见范围查询员工，支持部门和姓名/账号筛选
      description: 普通员工仅所属组织启用员工及最小字段；管理员保留旧范围与字段。departmentId仅DEPARTMENT直接归属，列表与total同范围。普通员工列表不开放详情、角色、权限或写入。
      parameters:
      - $ref: '#/components/parameters/DepartmentFilter'
      - $ref: '#/components/parameters/DirectoryKeyword'
      - $ref: '#/components/parameters/ManagementPageNumber'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 投影按管理员资格决定，不返回原始联系方式。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDirectoryResult'
              examples:
                ordinary:
                  value:
                    items:
                    - id: 101
                      username: engineering-employee
                      name: 示例员工
                      organizationId: 2
                    page: 1
                    pageSize: 20
                    total: 1
                administrator:
                  value:
                    items:
                    - id: 101
                      username: engineering-employee
                      name: 示例员工
                      organizationId: 2
                      sourceBranchName: null
                      sourceDepartmentName: null
                      jobTitle: null
                      phone: 138****0000
                      enabled: true
                    page: 1
                    pageSize: 20
                    total: 1
                emptyPage:
                  value:
                    items: []
                    page: 2
                    pageSize: 20
                    total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NoSession'
        '403':
          $ref: '#/components/responses/DirectoryReadForbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/MissingResource'
      x-implementation-status: implemented
  /api/employees/{employeeId}:
    get:
      operationId: getManagementEmployee
      tags:
      - 授权配置
      summary: 查询员工详情
      description: 检查资源的管理可见范围。
      parameters:
      - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: 资源资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementEmployee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NoSession'
        '403':
          $ref: '#/components/responses/ManagementReadForbidden'
        '404':
          $ref: '#/components/responses/MissingResource'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-implementation-status: retained
  /api/auth/me/permission-check:
    get:
      operationId: checkCurrentPermission
      tags:
      - 身份与认证
      summary: 校验当前用户的单项前端权限
      description: 已知目标无权返回200 allowed=false；未知目标404、无系统准入403。复用角色继承、组织策略和重授，不替代实际业务授权或对象状态检查。
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/IdentitySystemCode'
      - $ref: '#/components/parameters/IdentityPermissionCode'
      responses:
        '200':
          description: 当前判断结果，不构成后续调用凭证。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPermissionCheck'
              examples:
                result:
                  value:
                    systemCode: demo-engineering-app
                    permissionCode: request:approve
                    allowed: false
                allowed:
                  value:
                    systemCode: demo-engineering-app
                    permissionCode: request:approve
                    allowed: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NoSession'
        '403':
          $ref: '#/components/responses/CurrentSystemForbidden'
        '404':
          $ref: '#/components/responses/MissingCurrentPermission'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/auth/me/api-check:
    get:
      operationId: checkCurrentApiPermission
      tags:
      - 身份与认证
      summary: 判断当前用户调用指定业务API的系统级权限
      description: 已知目标无权返回200 allowed=false；未知目标404、无系统准入403。复用角色继承、组织策略和重授，不替代实际业务授权或对象状态检查。 映射缺失返回404 API_NOT_FOUND；空集合、跨系统引用或与规范定义不一致返回503
        AUTHORIZATION_UNAVAILABLE。首批仅注册四个demo申请系统、每系统八个申请操作，固定ALL。
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/IdentitySystemCode'
      - $ref: '#/components/parameters/IdentityOperationId'
      responses:
        '200':
          description: 当前判断结果，不构成后续调用凭证。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentApiCheck'
              examples:
                result:
                  value:
                    systemCode: demo-engineering-app
                    operationId: approveRequest
                    allowed: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NoSession'
        '403':
          $ref: '#/components/responses/CurrentSystemForbidden'
        '404':
          $ref: '#/components/responses/MissingCurrentApi'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256访问JWT；同时核对Redis随机sid登录记录和当前员工，业务权限实时计算。
    FuncRefreshCookie:
      type: apiKey
      in: cookie
      name: RBAC1_FUNC_REFRESH
      description: func版认证入口Cookie，HttpOnly、SameSite=Strict，公开Path=/func/api/auth/；生产HTTPS启用Secure。
    FuncCsrfCookie:
      type: apiKey
      in: cookie
      name: RBAC1_FUNC_CSRF
      description: func版认证入口Cookie，HttpOnly、SameSite=Strict，公开Path=/func/api/auth/；生产HTTPS启用Secure。
    OoRefreshCookie:
      type: apiKey
      in: cookie
      name: RBAC1_OO_REFRESH
      description: oo版认证入口Cookie，HttpOnly、SameSite=Strict，公开Path=/oo/api/auth/；生产HTTPS启用Secure。
    OoCsrfCookie:
      type: apiKey
      in: cookie
      name: RBAC1_OO_CSRF
      description: oo版认证入口Cookie，HttpOnly、SameSite=Strict，公开Path=/oo/api/auth/；生产HTTPS启用Secure。
  headers:
    AuthCookie:
      description: 认证Cookie可能包含多行Set-Cookie，请分别保存，不按逗号合并；不再设置Session Cookie。
      schema:
        type: string
    NoStore:
      description: 认证及身份响应禁止缓存
      schema:
        type: string
        enum:
        - no-store
  parameters:
    IdentityOperationId:
      name: operationId
      in: query
      required: true
      description: 已注册的目标业务 API operationId。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: \S
    ParentRoleId:
      name: parentRoleId
      in: path
      required: true
      description: 被继承且提供权限的低级角色 ID
      schema:
        type: integer
        format: int64
        minimum: 1
    EffectivePermissionSystemCode:
      name: systemCode
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PermissionCode:
      name: permissionCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SystemCode:
      name: systemCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: 仅登录/刷新/退出必需：先GET /api/auth/csrf，携带该Cookie及JSON token作为X-CSRF-TOKEN。Bearer业务写入不要求此头。
      schema:
        type: string
        minLength: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    ManagementPageNumber:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 21474836
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdentitySystemCode:
      name: systemCode
      in: query
      required: true
      description: 显式指定业务系统，不代表版本前缀；系统准入必须验证。
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: \S
    OptionalIdentitySystemCode:
      name: systemCode
      in: query
      required: false
      description: 显式指定业务系统，不代表版本前缀；系统准入必须验证。
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: \S
    IdentityPermissionCode:
      name: permissionCode
      in: query
      required: true
      description: 目标系统中现有权限码。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: \S
    DirectoryView:
      name: view
      in: query
      required: false
      description: directory保留旧管理员原表目录；tree使用正式层级和身份范围。
      schema:
        type: string
        enum:
        - directory
        - tree
        default: directory
    DirectoryParent:
      name: parentId
      in: query
      required: false
      description: 只适用tree，查可见正式组织的直接子级；与rootsOnly互斥。
      schema:
        type: integer
        format: int64
        minimum: 1
    DirectoryRoots:
      name: rootsOnly
      in: query
      required: false
      description: 只适用tree；true只查可见根，false查全部可见节点；无parentId/q时省略默认true。
      schema:
        type: boolean
    DirectoryKeyword:
      name: q
      in: query
      required: false
      description: 去首尾空白；空白无筛选；包含匹配，%/_为普通字符。
      schema:
        type: string
        maxLength: 128
    DepartmentFilter:
      name: departmentId
      in: query
      required: false
      description: 只查直接归属；必须为可见 DEPARTMENT，类型错误400、不存在404、越界403。
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRefresh:
      description: 刷新凭证无效/到期或确认重用；清除本次客户端认证Cookie，重用同时撤销对应登录。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            REFRESH_TOKEN_INVALID:
              value:
                code: REFRESH_TOKEN_INVALID
                message: 刷新凭证无效，请重新登录
            REFRESH_TOKEN_REUSED:
              value:
                code: REFRESH_TOKEN_REUSED
                message: 登录凭证已失效，请重新登录
    MissingCurrentApi:
      description: 未知系统或目标系统未登记该API；先验证系统准入。
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            SYSTEM_NOT_FOUND:
              value:
                code: SYSTEM_NOT_FOUND
                message: 业务系统不存在
            API_NOT_FOUND:
              value:
                code: API_NOT_FOUND
                message: 目标系统的API映射不存在
    BadRequest:
      description: 请求格式或参数无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            VALIDATION_FAILED:
              value:
                code: VALIDATION_FAILED
                message: 请求参数无效
    NoSession:
      description: 缺少/无效/已撤销Bearer身份或员工不可登录；单纯访问JWT过期单独返回ACCESS_TOKEN_EXPIRED。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            AUTHENTICATION_REQUIRED:
              value:
                code: AUTHENTICATION_REQUIRED
                message: 请登录后重试
            ACCESS_TOKEN_EXPIRED:
              value:
                code: ACCESS_TOKEN_EXPIRED
                message: 访问凭证已过期
      headers:
        WWW-Authenticate:
          description: 业务认证错误保留Bearer challenge。
          schema:
            type: string
    BadLogin:
      description: 账号不可登录或凭据无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            INVALID_CREDENTIALS:
              value:
                code: INVALID_CREDENTIALS
                message: 用户名或密码无效，或账号不可登录
    Csrf:
      description: CSRF 校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            CSRF_INVALID:
              value:
                code: CSRF_INVALID
                message: 请重新获取安全令牌
    Forbidden:
      description: 管理端准入、操作权限或范围校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            PERMISSION_DENIED:
              value:
                code: PERMISSION_DENIED
                message: 无权操作该分配关系
            CSRF_INVALID:
              value:
                code: CSRF_INVALID
                message: 请重新获取安全令牌
    ManagementConflict:
      description: 资源重复、仍被引用或已有分配阻止调岗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            RESOURCE_CONFLICT:
              value:
                code: RESOURCE_CONFLICT
                message: 资源重复或仍被引用
            ASSIGNMENT_CONFLICT:
              value:
                code: ASSIGNMENT_CONFLICT
                message: 调岗前请先解除角色和管理员配置
    ManagementWriteForbidden:
      description: 管理员资格或写入范围校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ManagementReadForbidden:
      description: 管理员资格或数据范围校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BusinessForbidden:
      description: 无权进入系统
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            SYSTEM_ACCESS_DENIED:
              value:
                code: SYSTEM_ACCESS_DENIED
                message: 无权进入该业务系统
    ApprovalForbidden:
      description: 审批前置检查失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            SYSTEM_ACCESS_DENIED:
              value:
                code: SYSTEM_ACCESS_DENIED
                message: 无权进入该业务系统
            PERMISSION_DENIED:
              value:
                code: PERMISSION_DENIED
                message: 缺少审批权限或操作已停用
            CSRF_INVALID:
              value:
                code: CSRF_INVALID
                message: 请重新获取安全令牌
    MissingSystem:
      description: 系统不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            SYSTEM_NOT_FOUND:
              value:
                code: SYSTEM_NOT_FOUND
                message: 业务系统不存在
    MissingRequest:
      description: 申请不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            REQUEST_NOT_FOUND:
              value:
                code: REQUEST_NOT_FOUND
                message: 申请不存在
    MissingResource:
      description: 目标资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            RESOURCE_NOT_FOUND:
              value:
                code: RESOURCE_NOT_FOUND
                message: 员工、角色或权限不存在
    ApprovalConflict:
      description: 申请状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            REQUEST_ALREADY_APPROVED:
              value:
                code: REQUEST_ALREADY_APPROVED
                message: 申请已审批
            REQUEST_STATE_CONFLICT:
              value:
                code: REQUEST_STATE_CONFLICT
                message: 当前申请状态不允许该操作
    RequestActionForbidden:
      description: CSRF、系统准入、动作权限或申请人校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidCsrf:
              value:
                code: CSRF_INVALID
                message: 请重新获取安全令牌
            systemDenied:
              value:
                code: SYSTEM_ACCESS_DENIED
                message: 无权进入该业务系统
            actionDenied:
              value:
                code: PERMISSION_DENIED
                message: 无权执行该申请操作
    RequestStateConflict:
      description: 申请状态不允许操作，或另一项状态转换已提交
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            stateConflict:
              value:
                code: REQUEST_STATE_CONFLICT
                message: 当前申请状态不允许该操作
    AssignmentConflict:
      description: 目标状态不允许建立分配
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ASSIGNMENT_CONFLICT:
              value:
                code: ASSIGNMENT_CONFLICT
                message: 当前状态不允许建立分配
    MediaType:
      description: 不支持的媒体类型
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            UNSUPPORTED_MEDIA_TYPE:
              value:
                code: UNSUPPORTED_MEDIA_TYPE
                message: 请使用 application/json
    Unavailable:
      description: 认证Redis或授权数据库暂不可用，不降级为登录失败、无权限或allowed=false。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            AUTHORIZATION_UNAVAILABLE:
              value:
                code: AUTHORIZATION_UNAVAILABLE
                message: 授权数据暂不可用
            SERVICE_UNAVAILABLE:
              value:
                code: SERVICE_UNAVAILABLE
                message: 业务数据服务暂不可用
            AUTHENTICATION_UNAVAILABLE:
              value:
                code: AUTHENTICATION_UNAVAILABLE
                message: 认证服务暂不可用
    CurrentSystemForbidden:
      description: 目标业务系统存在，但当前用户不可进入。
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            denied:
              value:
                code: SYSTEM_ACCESS_DENIED
                message: 无权进入该业务系统
    MissingCurrentPermission:
      description: 系统不存在；或已准入但目标权限不存在。
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            SYSTEM_NOT_FOUND:
              value:
                code: SYSTEM_NOT_FOUND
                message: 业务系统不存在
            PERMISSION_NOT_FOUND:
              value:
                code: PERMISSION_NOT_FOUND
                message: 目标系统的权限不存在
    DirectoryReadForbidden:
      description: 无原表目录管理资格，或指定组织超出当前目录读取范围。普通树和员工列表不要求管理员资格。
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PERMISSION_DENIED
            message: 无权查看该组织的数据
  schemas:
    AccessToken:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: 短期RS256签名访问JWT，仅存于前端内存；业务请求使用Bearer。
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          maximum: 900
          description: 实际剩余秒数，临近登录上限时可能小于900。
      required:
      - accessToken
      - tokenType
      - expiresIn
    LoginResponse:
      type: object
      properties:
        employee:
          $ref: '#/components/schemas/EmployeeIdentity'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        defaultWorkspaceKey:
          type: string
          nullable: true
          description: 管理员选 admin；员工优先部门默认系统，再选公司默认系统；无可用默认项时为 null。非 null 值必须存在于 workspaces。
        accessToken:
          type: string
          description: 短期RS256签名访问JWT，仅存于前端内存；业务请求使用Bearer。
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          maximum: 900
          description: 实际剩余秒数，临近登录上限时可能小于900。
      required:
      - employee
      - workspaces
      - defaultWorkspaceKey
      - accessToken
      - tokenType
      - expiresIn
      additionalProperties: false
    CurrentApiCheck:
      type: object
      additionalProperties: false
      properties:
        systemCode:
          type: string
          minLength: 1
          maxLength: 64
          pattern: \S
        operationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: \S
        allowed:
          type: boolean
      required:
      - systemCode
      - operationId
      - allowed
    Error:
      type: object
      properties:
