# C2 两版共用接口，实施及测试结果见双版本测试记录。
openapi: "3.0.3"
info:
  title: "OOAD RBAC · C2 双后端接口"
  version: "2.1.0"
  description: "沿用 C1 接口，扩展角色继承、员工有效权限查询与业务申请 CRUD。两版共用申请查看权限、动作权限与验收场景。"
servers:
  - url: "/func"
    description: "面向功能版"
  - url: "/oo"
    description: "面向对象版"
tags:
  - name: "登录与会话"
  - name: "业务模拟"
  - name: "授权配置"
security:
  - FuncSessionCookie: []
  - OoSessionCookie: []
paths:
  "/api/auth/csrf":
    get:
      operationId: "getCsrf"
      tags:
        - "登录与会话"
      summary: "获取 CSRF 令牌"
      description: "登录前可调用。保留匿名会话 Cookie，登录成功后重新获取令牌。"
      security: []
      responses:
        "200":
          description: "返回当前会话的令牌"
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/auth/login":
    post:
      operationId: "login"
      tags:
        - "登录与会话"
      summary: "登录"
      description: "提交匿名会话的 CSRF 令牌及 JSON 凭据。成功时轮换会话 ID，旧令牌失效。账号不存在、密码错误、待匹配或停用均返回相同错误。"
      security: []
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "登录成功，返回身份与工作区"
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BadLogin"
        "403":
          $ref: "#/components/responses/Csrf"
        "415":
          $ref: "#/components/responses/MediaType"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/auth/me":
    get:
      operationId: "getCurrentSession"
      tags:
        - "登录与会话"
      summary: "查询当前身份与工作区"
      description: "每次按最新组织和授权状态查询，当前账号来自会话。"
      responses:
        "200":
          description: "当前身份与导航信息"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "401":
          $ref: "#/components/responses/NoSession"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/auth/logout":
    post:
      operationId: "logout"
      tags:
        - "登录与会话"
      summary: "退出登录"
      description: "注销 Redis 会话并清除当前版本的会话 Cookie。CSRF 校验先失败时返回 403。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "退出成功"
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Csrf"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/business-systems":
    get:
      operationId: "listBusinessSystems"
      tags:
        - "业务模拟"
      summary: "查询可进入的业务系统"
      description: "按当前身份筛选系统。没有可进入的系统时返回空数组。"
      responses:
        "200":
          description: "可进入的系统列表"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/BusinessSystem"
        "401":
          $ref: "#/components/responses/NoSession"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/business-systems/{systemCode}/requests":
    parameters:
      - $ref: "#/components/parameters/SystemCode"
    get:
      operationId: "listSystemRequests"
      tags:
        - "业务模拟"
      summary: "查询系统申请"
      description: "要求系统准入及目标系统的 request:read。分页返回全部未删除状态，含已撤回、已驳回记录。按申请 ID 升序；无查看权返回 403，allowedActions 仅列写动作。"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "模拟申请分页"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/RequestPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/BusinessForbidden"
        "404":
          $ref: "#/components/responses/MissingSystem"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: "createRequest"
      tags: ["业务模拟"]
      summary: "发起模拟申请"
      description: "要求系统准入及 request:create。服务端从会话取得申请人，创建 PENDING 申请。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {$ref: "#/components/schemas/RequestTitleInput"}
      responses:
        "201":
          description: "申请已创建"
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/RequestDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/NoSession"}
        "403": {$ref: "#/components/responses/RequestActionForbidden"}
        "404": {$ref: "#/components/responses/MissingSystem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  "/api/requests/{requestId}":
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: "getRequest"
      tags: ["业务模拟"]
      summary: "查询申请详情"
      description: "按申请记录所属系统检查准入及 request:read，历史申请与全部状态同样适用。无查看权返回 403，已删除的申请返回 404。"
      responses:
        "200":
          description: "申请详情"
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/RequestDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/NoSession"}
        "403": {$ref: "#/components/responses/BusinessForbidden"}
        "404": {$ref: "#/components/responses/MissingRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}
    patch:
      operationId: "updateRequest"
      tags: ["业务模拟"]
      summary: "修改待审批申请"
      description: "要求系统准入、request:read 及 request:update、申请人本人及 PENDING 状态。仅修改可编辑字段，仍为 PENDING。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {$ref: "#/components/schemas/RequestTitleInput"}
      responses:
        "200":
          description: "申请已修改"
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/RequestDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/NoSession"}
        "403": {$ref: "#/components/responses/RequestActionForbidden"}
        "404": {$ref: "#/components/responses/MissingRequest"}
        "409": {$ref: "#/components/responses/RequestStateConflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
    delete:
      operationId: "deleteRejectedRequest"
      tags: ["业务模拟"]
      summary: "删除本人已驳回的申请"
      description: "要求系统准入、request:read 及 request:delete、申请人本人及 REJECTED 状态。成功后数据从列表和详情隐藏，保留操作日志。重复访问已删除申请返回 404。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "申请已删除"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/NoSession"}
        "403": {$ref: "#/components/responses/RequestActionForbidden"}
        "404": {$ref: "#/components/responses/MissingRequest"}
        "409": {$ref: "#/components/responses/RequestStateConflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  "/api/requests/{requestId}/withdraw":
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: "withdrawRequest"
      tags: ["业务模拟"]
      summary: "撤回待审批申请"
      description: "要求系统准入、request:read 及 request:withdraw、申请人本人及 PENDING 状态。撤回后为 WITHDRAWN，原单不可重提。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: "撤回待审批申请成功"
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/RequestDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/NoSession"}
        "403": {$ref: "#/components/responses/RequestActionForbidden"}
        "404": {$ref: "#/components/responses/MissingRequest"}
        "409": {$ref: "#/components/responses/RequestStateConflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  "/api/requests/{requestId}/reject":
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: "rejectRequest"
      tags: ["业务模拟"]
      summary: "驳回待审批申请"
      description: "要求系统准入、request:read 及 request:reject 及 PENDING 状态。驳回后为 REJECTED。有对应权限的申请人可以驳回自己的申请。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: "驳回待审批申请成功"
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/RequestDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/NoSession"}
        "403": {$ref: "#/components/responses/RequestActionForbidden"}
        "404": {$ref: "#/components/responses/MissingRequest"}
        "409": {$ref: "#/components/responses/RequestStateConflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  "/api/requests/{requestId}/approve":
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: "approveRequest"
      tags:
        - "业务模拟"
      summary: "审批模拟申请"
      description: "从申请记录确定所属系统，检查系统准入、组织停用和该系统的 request:read、request:approve 权限。超级管理员默认具有仍开放的权限。仅待审批申请可提交更新。有对应权限的申请人可以审批自己的申请。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: "鉴权通过且审批成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApprovalResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ApprovalForbidden"
        "404":
          $ref: "#/components/responses/MissingRequest"
        "409":
          $ref: "#/components/responses/ApprovalConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/employees/{employeeId}/roles/{roleId}":
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
      - $ref: "#/components/parameters/RoleId"
    put:
      operationId: "grantEmployeeRole"
      tags:
        - "授权配置"
      summary: "授予员工角色"
      description: "要求 employee-role:write。Service 检查管理准入、范围及关系两端。关系已存在时允许幂等重试；待匹配或停用员工、已停用权限不能新增相应分配。提交成功后响应。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "关系已建立"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "409":
          $ref: "#/components/responses/AssignmentConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: "revokeEmployeeRole"
      tags:
        - "授权配置"
      summary: "撤销员工角色"
      description: "要求 employee-role:write。Service 检查管理准入、范围及关系两端。两端存在且关系已移除时允许幂等重试。提交成功后响应。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "关系已撤销"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/roles/{roleId}/permissions/{permissionId}":
    parameters:
      - $ref: "#/components/parameters/RoleId"
      - $ref: "#/components/parameters/PermissionId"
    put:
      operationId: "grantRolePermission"
      tags:
        - "授权配置"
      summary: "授予角色权限"
      description: "要求 role-permission:write。Service 检查管理准入、范围及关系两端。关系已存在时允许幂等重试；待匹配或停用员工、已停用权限不能新增相应分配。提交成功后响应。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "关系已建立"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "409":
          $ref: "#/components/responses/AssignmentConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: "revokeRolePermission"
      tags:
        - "授权配置"
      summary: "撤销角色权限"
      description: "要求 role-permission:write。Service 检查管理准入、范围及关系两端。两端存在且关系已移除时允许幂等重试。提交成功后响应。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "关系已撤销"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/organizations/{organizationId}/business-systems/{systemCode}/permissions/{permissionCode}/disabled":
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/SystemCode"
      - $ref: "#/components/parameters/PermissionCode"
    put:
      operationId: "disableOrganizationPermission"
      tags:
        - "授权配置"
      summary: "停用组织动作"
      description: "仅超级管理员可操作。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "操作已提交，重复提交幂等"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: "reopenOrganizationPermission"
      tags:
        - "授权配置"
      summary: "重新开放组织动作"
      description: "仅超级管理员可操作。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "操作已提交，重复提交幂等"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/organizations/{organizationId}/business-systems/{systemCode}/permissions/{permissionCode}/regrants/{roleId}":
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/SystemCode"
      - $ref: "#/components/parameters/PermissionCode"
      - $ref: "#/components/parameters/RoleId"
    put:
      operationId: "regrantOrganizationPermission"
      tags:
        - "授权配置"
      summary: "按角色重授组织动作"
      description: "仅超级管理员可操作。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "操作已提交，重复提交幂等"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "409":
          $ref: "#/components/responses/AssignmentConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/employees":
    post:
      operationId: "createManagementEmployee"
      tags: ["授权配置"]
      summary: "新增员工"
      description: "按当前管理员的组织范围创建员工资料。登录凭据单独配置。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ManagementEmployeeCreate"
      responses:
        "201":
          description: "资源资料"
          headers:
            Location:
              schema: {type: "string"}
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ManagementEmployee"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ManagementWriteForbidden"
        "404":
          $ref: "#/components/responses/MissingResource"
        "409":
          $ref: "#/components/responses/ManagementConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: "listManagementEmployees"
      tags: ["授权配置"]
      summary: "查看范围内员工及原表字段"
      description: "限当前管理员的可见范围，结果按 ID 升序，total 为范围内总数。"
      parameters:
        - $ref: "#/components/parameters/ManagementPageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "管理员可见结果"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ManagementEmployeePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ManagementReadForbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/companies":
    get:
      operationId: "listManagementCompanies"
      tags: ["授权配置"]
      summary: "查询公司目录"
      description: "限当前管理员的可见范围，结果按 ID 升序，total 为范围内总数。"
      parameters:
        - $ref: "#/components/parameters/ManagementPageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "管理员可见结果"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ManagementOrganizationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ManagementReadForbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/departments":
    get:
      operationId: "listManagementDepartments"
      tags: ["授权配置"]
      summary: "查询部门原表三列及正式组织引用"
      description: "含原表中归类为公司的组织行和演示部门。按管理员可见范围分页，total 为范围内总数。"
      parameters:
        - $ref: "#/components/parameters/ManagementPageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "管理员可见结果"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ManagementOrganizationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/ManagementReadForbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/roles":
    post:
      operationId: "createManagementRole"
      tags: ["授权配置"]
      summary: "新增角色"
      description: "按组织范围新增角色。空归属表示全局共享，仅超级管理员可创建。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
