    get:
      operationId: "listRoleParents"
      tags: ["授权配置"]
      summary: "查询直接继承角色"
      description: "roleId 接收权限。校验管理读取范围，按 ID 升序分页。"
      parameters:
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/ManagementPageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "查询直接继承角色成功"
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/ManagementRolePage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/NoSession"}
        "403": {$ref: "#/components/responses/ManagementReadForbidden"}
        "404": {$ref: "#/components/responses/MissingResource"}
        "503": {$ref: "#/components/responses/Unavailable"}
  "/api/roles/{roleId}/parents/{parentRoleId}":
    parameters:
      - $ref: "#/components/parameters/RoleId"
      - $ref: "#/components/parameters/ParentRoleId"
    put:
      operationId: "addRoleParent"
      tags: ["授权配置"]
      summary: "添加角色继承"
      description: "要求可管理两端且归属相同，检查当前分配和权限变化。合法重复添加幂等。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204": {description: "继承关系已建立"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/NoSession"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/MissingResource"}
        "409":
          description: "继承或分配规则冲突"
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/Error"}
              examples:
                selfInheritance:
                  value: {code: "SELF_ROLE_INHERITANCE", message: "角色不能继承自身"}
                cycle:
                  value: {code: "ROLE_INHERITANCE_CYCLE", message: "角色继承关系不能形成环路"}
                scope:
                  value: {code: "ROLE_INHERITANCE_SCOPE_MISMATCH", message: "角色归属必须相同"}
                assignment:
                  value: {code: "ASSIGNMENT_CONFLICT", message: "当前状态不允许建立分配"}
        "503": {$ref: "#/components/responses/Unavailable"}
    delete:
      operationId: "removeRoleParent"
      tags: ["授权配置"]
      summary: "删除角色继承"
      description: "要求可管理两端。两端均存在且可操作时，重复删除不存在的边返回 204。"
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204": {description: "继承关系已移除"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/NoSession"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/MissingResource"}
        "503": {$ref: "#/components/responses/Unavailable"}
  "/api/employees/{employeeId}/effective-permissions":
    get:
      operationId: "listEmployeeEffectivePermissions"
      tags: ["授权配置"]
      summary: "查询员工有效权限"
      description: "按指定业务系统查询，先校验查询者的管理范围，再按目标员工准入和当前组织策略求值，按权限 ID 去重及升序分页。"
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
        - $ref: "#/components/parameters/EffectivePermissionSystemCode"
        - $ref: "#/components/parameters/ManagementPageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "查询员工有效权限成功"
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/ManagementPermissionPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/NoSession"}
        "403":
          description: "管理范围不足，或目标员工无系统准入"
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/Error"}
              examples:
                managementDenied:
                  value: {code: "PERMISSION_DENIED", message: "无权查看该管理数据"}
                systemDenied:
                  value: {code: "SYSTEM_ACCESS_DENIED", message: "无权进入该业务系统"}
        "404":
          description: "员工或业务系统不存在"
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/Error"}
              examples:
                employeeNotFound:
                  value: {code: "RESOURCE_NOT_FOUND", message: "员工、角色或权限不存在"}
                systemNotFound:
                  value: {code: "SYSTEM_NOT_FOUND", message: "业务系统不存在"}
        "503": {$ref: "#/components/responses/Unavailable"}
components:
  securitySchemes:
    FuncSessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "RBAC1_FUNC_SESSION"
      description: "功能版 Cookie。HttpOnly，Path=/func/，SameSite=Lax，HTTPS 部署启用 Secure。"
    OoSessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "RBAC1_OO_SESSION"
      description: "对象版 Cookie。HttpOnly，Path=/oo/，SameSite=Lax，HTTPS 部署启用 Secure。"
  headers:
    SessionCookie:
      description: "建立、轮换或清除会话 Cookie"
      schema:
        type: "string"
    NoStore:
      description: "会话响应禁止缓存"
      schema:
        type: "string"
        enum:
          - "no-store"
  parameters:
    ParentRoleId:
      name: "parentRoleId"
      in: "path"
      required: true
      description: "被继承且提供权限的低级角色 ID"
      schema: {type: "integer", format: "int64", minimum: 1}
    EffectivePermissionSystemCode:
      name: "systemCode"
      in: "query"
      required: true
      schema: {type: "string", minLength: 1}
    OrganizationId:
      name: "organizationId"
      in: "path"
      required: true
      schema:
        type: "integer"
        format: "int64"
        minimum: 1
    PermissionCode:
      name: "permissionCode"
      in: "path"
      required: true
      schema:
        type: "string"
        minLength: 1
        maxLength: 128
    EmployeeId:
      name: "employeeId"
      in: "path"
      required: true
      schema:
        type: "integer"
        format: "int64"
        minimum: 1
    RoleId:
      name: "roleId"
      in: "path"
      required: true
      schema:
        type: "integer"
        format: "int64"
        minimum: 1
    PermissionId:
      name: "permissionId"
      in: "path"
      required: true
      schema:
        type: "integer"
        format: "int64"
        minimum: 1
    RequestId:
      name: "requestId"
      in: "path"
      required: true
      schema:
        type: "integer"
        format: "int64"
        minimum: 1
    SystemCode:
      name: "systemCode"
      in: "path"
      required: true
      schema:
        type: "string"
        minLength: 1
        maxLength: 64
    Csrf:
      name: "X-CSRF-TOKEN"
      in: "header"
      required: true
      description: "使用相同会话获取的 CSRF 令牌"
      schema:
        type: "string"
        minLength: 1
    Page:
      name: "page"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        default: 1
    ManagementPageNumber:
      name: "page"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 21474836
        default: 1
    PageSize:
      name: "pageSize"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: "请求格式或参数无效"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            VALIDATION_FAILED:
              value:
                code: "VALIDATION_FAILED"
                message: "请求参数无效"
    NoSession:
      description: "需要有效登录会话"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            AUTHENTICATION_REQUIRED:
              value:
                code: "AUTHENTICATION_REQUIRED"
                message: "请登录后重试"
    BadLogin:
      description: "账号不可登录或凭据无效"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            INVALID_CREDENTIALS:
              value:
                code: "INVALID_CREDENTIALS"
                message: "用户名或密码无效，或账号不可登录"
    Csrf:
      description: "CSRF 校验失败"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            CSRF_INVALID:
              value:
                code: "CSRF_INVALID"
                message: "请重新获取安全令牌"
    Forbidden:
      description: "管理端准入、操作权限或范围校验失败"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            PERMISSION_DENIED:
              value:
                code: "PERMISSION_DENIED"
                message: "无权操作该分配关系"
            CSRF_INVALID:
              value:
                code: "CSRF_INVALID"
                message: "请重新获取安全令牌"
    ManagementConflict:
      description: "资源重复、仍被引用或已有分配阻止调岗"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            RESOURCE_CONFLICT:
              value: {code: "RESOURCE_CONFLICT", message: "资源重复或仍被引用"}
            ASSIGNMENT_CONFLICT:
              value: {code: "ASSIGNMENT_CONFLICT", message: "调岗前请先解除角色和管理员配置"}
    ManagementWriteForbidden:
      description: "管理员资格或写入范围校验失败"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    ManagementReadForbidden:
      description: "管理员资格或数据范围校验失败"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    BusinessForbidden:
      description: "无权进入系统"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            SYSTEM_ACCESS_DENIED:
              value:
                code: "SYSTEM_ACCESS_DENIED"
                message: "无权进入该业务系统"
    ApprovalForbidden:
      description: "审批前置检查失败"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            SYSTEM_ACCESS_DENIED:
              value:
                code: "SYSTEM_ACCESS_DENIED"
                message: "无权进入该业务系统"
            PERMISSION_DENIED:
              value:
                code: "PERMISSION_DENIED"
                message: "缺少审批权限或操作已停用"
            CSRF_INVALID:
              value:
                code: "CSRF_INVALID"
                message: "请重新获取安全令牌"
    MissingSystem:
      description: "系统不存在"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            SYSTEM_NOT_FOUND:
              value:
                code: "SYSTEM_NOT_FOUND"
                message: "业务系统不存在"
    MissingRequest:
      description: "申请不存在"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            REQUEST_NOT_FOUND:
              value:
                code: "REQUEST_NOT_FOUND"
                message: "申请不存在"
    MissingResource:
      description: "目标资源不存在"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            RESOURCE_NOT_FOUND:
              value:
                code: "RESOURCE_NOT_FOUND"
                message: "员工、角色或权限不存在"
    ApprovalConflict:
      description: "申请状态冲突"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            REQUEST_ALREADY_APPROVED:
              value:
                code: "REQUEST_ALREADY_APPROVED"
                message: "申请已审批"
            REQUEST_STATE_CONFLICT:
              value: {code: "REQUEST_STATE_CONFLICT", message: "当前申请状态不允许该操作"}
    RequestActionForbidden:
      description: "CSRF、系统准入、动作权限或申请人校验失败"
      content:
        "application/json":
          schema: {$ref: "#/components/schemas/Error"}
          examples:
            invalidCsrf:
              value: {code: "CSRF_INVALID", message: "请重新获取安全令牌"}
            systemDenied:
              value: {code: "SYSTEM_ACCESS_DENIED", message: "无权进入该业务系统"}
            actionDenied:
              value: {code: "PERMISSION_DENIED", message: "无权执行该申请操作"}
    RequestStateConflict:
      description: "申请状态不允许操作，或另一项状态转换已提交"
      content:
        "application/json":
          schema: {$ref: "#/components/schemas/Error"}
          examples:
            stateConflict:
              value: {code: "REQUEST_STATE_CONFLICT", message: "当前申请状态不允许该操作"}
    AssignmentConflict:
      description: "目标状态不允许建立分配"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            ASSIGNMENT_CONFLICT:
              value:
                code: "ASSIGNMENT_CONFLICT"
                message: "当前状态不允许建立分配"
    MediaType:
      description: "不支持的媒体类型"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            UNSUPPORTED_MEDIA_TYPE:
              value:
                code: "UNSUPPORTED_MEDIA_TYPE"
                message: "请使用 application/json"
    Unavailable:
      description: "所需依赖暂不可用"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            SESSION_UNAVAILABLE:
              value:
                code: "SESSION_UNAVAILABLE"
                message: "会话服务暂不可用"
            AUTHORIZATION_UNAVAILABLE:
              value:
                code: "AUTHORIZATION_UNAVAILABLE"
                message: "授权数据暂不可用"
            SERVICE_UNAVAILABLE:
              value:
                code: "SERVICE_UNAVAILABLE"
                message: "业务数据服务暂不可用"
  schemas:
    Error:
      type: "object"
      properties:
        code:
          type: "string"
        message:
          type: "string"
      required:
        - "code"
        - "message"
    LoginRequest:
      type: "object"
      properties:
        username:
          type: "string"
          minLength: 1
          maxLength: 128
        password:
          type: "string"
          format: "password"
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
        - "username"
        - "password"
      additionalProperties: false
    ManagementEmployeeCreate:
      type: "object"
      properties:
        username: {type: "string", minLength: 1, maxLength: 128}
        name: {type: "string", minLength: 1, maxLength: 128}
        organizationId: {type: "integer", format: "int64", minimum: 1}
        jobTitle: {type: "string", maxLength: 128, nullable: true}
        phone: {type: "string", maxLength: 32, nullable: true}
      required: [username, name, organizationId]
    ManagementEmployeePatch:
      type: "object"
      properties:
        name: {type: "string", minLength: 1, maxLength: 128}
        organizationId: {type: "integer", format: "int64", minimum: 1}
        jobTitle: {type: "string", maxLength: 128}
        phone: {type: "string", maxLength: 32}
      description: "省略字段保留原值；岗位或电话为空字符串时清除，同时保留原表归属字段。"
    ManagementRoleCreate:
      type: "object"
      properties:
        name: {type: "string", minLength: 1, maxLength: 128}
        ownerOrganizationId: {type: "integer", format: "int64", minimum: 1, nullable: true}
      required: [name]
    ManagementPermissionCreate:
      type: "object"
      properties:
        code: {type: "string", maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9:_.-]*$"}
        name: {type: "string", minLength: 1, maxLength: 128}
        systemId: {type: "integer", format: "int64", minimum: 1, nullable: true}
        ownerOrganizationId: {type: "integer", format: "int64", minimum: 1, nullable: true}
      required: [code, name]
    ManagementRename:
      type: "object"
      properties:
        name: {type: "string", minLength: 1, maxLength: 128}
      required: [name]
    ManagementPage:
      type: "object"
      properties:
        page: {type: "integer", minimum: 1}
        pageSize: {type: "integer", minimum: 1, maximum: 100}
        total: {type: "integer", format: "int64", minimum: 0}
      required: [page, pageSize, total]
    ManagementEmployee:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        username:
          type: "string"
        name:
          type: "string"
        organizationId:
          type: "integer"
          format: "int64"
          nullable: true
        sourceBranchName:
          type: "string"
          nullable: true
        sourceDepartmentName:
          type: "string"
          nullable: true
        jobTitle:
          type: "string"
          nullable: true
        phone:
          type: "string"
          nullable: true
        enabled:
          type: "boolean"
      required: [id, username, name, organizationId, sourceBranchName, sourceDepartmentName, jobTitle, phone, enabled]
    ManagementEmployeePage:
      allOf:
        - $ref: "#/components/schemas/ManagementPage"
        - type: "object"
          properties:
            items:
              type: "array"
              items:
                $ref: "#/components/schemas/ManagementEmployee"
          required: [items]
    ManagementOrganization:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        code:
          type: "string"
        name:
          type: "string"
        parentId:
          type: "integer"
          format: "int64"
          nullable: true
        managerName:
          type: "string"
          nullable: true
        sourceParentName:
          type: "string"
          nullable: true
      required: [id, code, name, parentId, managerName, sourceParentName]
    ManagementOrganizationPage:
      allOf:
        - $ref: "#/components/schemas/ManagementPage"
        - type: "object"
          properties:
            items:
              type: "array"
              items:
                $ref: "#/components/schemas/ManagementOrganization"
          required: [items]
    ManagementRole:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        ownerOrganizationId:
          type: "integer"
          format: "int64"
          nullable: true
      required: [id, name, ownerOrganizationId]
    ManagementRolePage:
      allOf:
        - $ref: "#/components/schemas/ManagementPage"
        - type: "object"
          properties:
            items:
              type: "array"
              items:
                $ref: "#/components/schemas/ManagementRole"
          required: [items]
    ManagementPermission:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        code:
          type: "string"
        name:
          type: "string"
        systemId:
          type: "integer"
          format: "int64"
          nullable: true
        ownerOrganizationId:
          type: "integer"
          format: "int64"
          nullable: true
      required: [id, code, name, systemId, ownerOrganizationId]
    ManagementPermissionPage:
      allOf:
        - $ref: "#/components/schemas/ManagementPage"
        - type: "object"
          properties:
            items:
              type: "array"
              items:
                $ref: "#/components/schemas/ManagementPermission"
          required: [items]
    ManagementCatalog:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        systemName:
          type: "string"
        moduleName:
          type: "string"
        featureName:
          type: "string"
        description:
          type: "string"
        administratorCell:
          type: "string"
          nullable: true
        executiveCell:
          type: "string"
          nullable: true
        departmentManagerCell:
          type: "string"
          nullable: true
        projectManagerCell:
          type: "string"
          nullable: true
        employeeCell:
          type: "string"
          nullable: true
      required: [id, systemName, moduleName, featureName, description, administratorCell, executiveCell, departmentManagerCell, projectManagerCell, employeeCell]
    ManagementCatalogPage:
      allOf:
        - $ref: "#/components/schemas/ManagementPage"
        - type: "object"
          properties:
            items:
              type: "array"
              items:
                $ref: "#/components/schemas/ManagementCatalog"
          required: [items]
    CsrfToken:
      type: "object"
      properties:
        token:
          type: "string"
          minLength: 1
      required:
        - "token"
    EmployeeIdentity:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
          minimum: 1
        username:
          type: "string"
        name:
          type: "string"
        organizationId:
          type: "integer"
          format: "int64"
          minimum: 1
      required:
        - "id"
        - "username"
        - "name"
        - "organizationId"
    OrganizationPermissionPolicy:
      type: "object"
      properties:
        status:
          type: "string"
          enum: ["OPEN", "DISABLED", "REOPENED"]
        roleIds:
          type: "array"
          items:
            type: "integer"
            format: "int64"
      required: [status, roleIds]
    BusinessSystem:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
          minimum: 1
        code:
          type: "string"
        name:
          type: "string"
        ownerOrganizationId:
          type: "integer"
          format: "int64"
          minimum: 1
        ownerOrganizationName:
          type: "string"
      required:
        - "id"
        - "code"
        - "name"
        - "ownerOrganizationId"
        - "ownerOrganizationName"
    Workspace:
      type: "object"
      properties:
        key:
          type: "string"
          description: "管理平台为 admin，业务系统为 business:<systemCode>"
        type:
          type: "string"
          enum:
            - "ADMIN"
            - "BUSINESS"
        name:
          type: "string"
        path:
          type: "string"
          description: "同源站点相对路径，如 /admin/ 或 /business/demo-engineering-app/"
      required:
        - "key"
        - "type"
        - "name"
        - "path"
    CurrentSession:
      type: "object"
      properties:
        employee:
          $ref: "#/components/schemas/EmployeeIdentity"
        workspaces:
          type: "array"
          items:
            $ref: "#/components/schemas/Workspace"
        defaultWorkspaceKey:
          type: "string"
          nullable: true
          description: "管理员选 admin；员工优先部门默认系统，再选公司默认系统；无可用默认项时为 null。非 null 值必须存在于 workspaces。"
      required:
        - "employee"
        - "workspaces"
        - "defaultWorkspaceKey"
    RequestTitleInput:
      type: "object"
      additionalProperties: false
      required: ["title"]
      properties:
        title:
          type: "string"
          minLength: 1
          maxLength: 128
          description: "标题为 1 至 128 字符，拒绝纯空白值，保存时去除首尾空白。"
      example: {title: "工程部设备维护申请"}
    RequestDetail:
      allOf:
        - $ref: "#/components/schemas/RequestSummary"
        - type: "object"
          required: ["applicantId"]
          properties:
            applicantId:
              type: "integer"
              format: "int64"
              minimum: 1
              nullable: true
              description: "当前申请人 ID。C1 遗留申请没有申请人时为 null。"
    RequestSummary:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
          minimum: 1
        title:
          type: "string"
        status:
          type: "string"
          enum:
            - "PENDING"
            - "APPROVED"
            - "WITHDRAWN"
            - "REJECTED"
      required:
        - "id"
        - "title"
        - "status"
    RequestPage:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/RequestSummary"
        allowedActions:
          type: "array"
          uniqueItems: true
          description: "当前会话在目标系统的有效申请动作。修改、撤回与删除仍须符合申请人和状态约束。"
          items:
            type: "string"
            enum: ["request:create", "request:update", "request:withdraw", "request:approve", "request:reject", "request:delete"]
        page:
          type: "integer"
          minimum: 1
        pageSize:
          type: "integer"
          minimum: 1
          maximum: 100
        total:
          type: "integer"
          format: "int64"
          minimum: 0
      required:
        - "items"
        - "page"
        - "pageSize"
        - "total"
        - "allowedActions"
    ApprovalResult:
      type: "object"
      properties:
        authorization:
          type: "string"
          enum:
            - "GRANTED"
        execution:
          type: "string"
          enum:
            - "SUCCEEDED"
        requestId:
          type: "integer"
          format: "int64"
          minimum: 1
        status:
          type: "string"
          enum:
            - "APPROVED"
      required:
        - "authorization"
        - "execution"
        - "requestId"
        - "status"
      example:
        authorization: "GRANTED"
        execution: "SUCCEEDED"
        requestId: 301
        status: "APPROVED"
