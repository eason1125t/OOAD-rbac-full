# 本版后端的连接、日志与JWT登录配置；由 RbacApplication 装配，凭据从环境变量读取。
# Flyway 管理表结构，Hibernate 在启动时核对 JPA 映射。
logging:
  level:
    root: INFO
    rbac0.api: ${RBAC_LOG_API:DEBUG}
    rbac0.service: ${RBAC_LOG_SERVICE:DEBUG}
    rbac0.infrastructure: ${RBAC_LOG_INFRASTRUCTURE:DEBUG}
spring:
  application:
    name: rbac1-func
  datasource:
    url: ${RBAC_DB_URL:jdbc:mysql://localhost:3306/ooad_rbac1_func}
    username: ${RBAC_DB_USER}
    password: ${RBAC_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true
  data:
    redis:
      host: ${RBAC_REDIS_HOST:localhost}
      port: ${RBAC_REDIS_PORT:6379}
      password: ${RBAC_REDIS_PASSWORD:}
      repositories:
        enabled: false
rbac:
  auth:
    issuer: ${RBAC_JWT_ISSUER:urn:ooad-rbac:c2:func}
    audience: ${RBAC_JWT_AUDIENCE:rbac1-func}
    private-key-location: ${RBAC_JWT_PRIVATE_KEY_LOCATION:}
    public-key-location: ${RBAC_JWT_PUBLIC_KEY_LOCATION:}
    access-ttl: ${RBAC_JWT_ACCESS_TTL:15m}
    login-ttl: ${RBAC_LOGIN_TTL:8h}
    namespace: ${RBAC_AUTH_NAMESPACE:rbac1:func:auth}
    refresh-cookie-name: ${RBAC_REFRESH_COOKIE_NAME:RBAC1_FUNC_REFRESH}
    csrf-cookie-name: ${RBAC_CSRF_COOKIE_NAME:RBAC1_FUNC_CSRF}
    cookie-path: ${RBAC_AUTH_COOKIE_PATH:/func/api/auth/}
    cookie-secure: ${RBAC_AUTH_COOKIE_SECURE:false}
