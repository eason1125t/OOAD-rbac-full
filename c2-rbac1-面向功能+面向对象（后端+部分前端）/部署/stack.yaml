# 功能：仅部署 C2 的 1 前端、2 后端与 MySQL/Redis。由 manage.py 注入参数并渲染。
version: "3.8"

x-backend: &backend
  networks: [app]
  environment: &backend-env
    SERVER_PORT: "8080"
    RBAC_DB_PASSWORD_FILE: /run/secrets/db_password
    RBAC_REDIS_HOST: redis
    RBAC_REDIS_PORT: "6379"
    RBAC_REDIS_PASSWORD_FILE: /run/secrets/redis_password
    RBAC_AUTH_COOKIE_SECURE: ${RBAC_AUTH_COOKIE_SECURE:-false}
    RBAC_JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt_private
    RBAC_JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public
    RBAC_LOG_API: INFO
    RBAC_LOG_SERVICE: INFO
    RBAC_LOG_INFRASTRUCTURE: INFO
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    replicas: 1
    restart_policy:
      condition: on-failure
      delay: 10s
    update_config:
      parallelism: 1
      order: start-first
      failure_action: rollback

services:
  frontend:
    image: ${RBAC_FRONTEND_IMAGE:?Set RBAC_FRONTEND_IMAGE}
    networks: [app]
    ports:
      - target: 8080
        published: ${RBAC_HTTP_PORT:-8080}
        protocol: tcp
        mode: ingress
    logging: *logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  backend-func:
    <<: *backend
    image: ${RBAC_FUNC_IMAGE:?Set RBAC_FUNC_IMAGE}
    environment:
      <<: *backend-env
      RBAC_DB_URL: jdbc:mysql://mysql:3306/ooad_rbac1_func
      RBAC_DB_USER: rbac_func
      RBAC_JWT_ISSUER: urn:ooad-rbac:c2:func
      RBAC_JWT_AUDIENCE: rbac1-func
      RBAC_REFRESH_COOKIE_NAME: RBAC1_FUNC_REFRESH
      RBAC_CSRF_COOKIE_NAME: RBAC1_FUNC_CSRF
      RBAC_AUTH_COOKIE_PATH: /func/api/auth/
      RBAC_AUTH_NAMESPACE: rbac1:func:auth
    secrets:
      - source: func_db_password
        target: db_password
      - redis_password
      - source: func_jwt_private
        target: jwt_private
      - source: func_jwt_public
        target: jwt_public

  backend-oo:
    <<: *backend
    image: ${RBAC_OO_IMAGE:?Set RBAC_OO_IMAGE}
    environment:
      <<: *backend-env
      RBAC_DB_URL: jdbc:mysql://mysql:3306/ooad_rbac1_oo
      RBAC_DB_USER: rbac_oo
      RBAC_JWT_ISSUER: urn:ooad-rbac:c2:oo
      RBAC_JWT_AUDIENCE: rbac1-oo
      RBAC_REFRESH_COOKIE_NAME: RBAC1_OO_REFRESH
      RBAC_CSRF_COOKIE_NAME: RBAC1_OO_CSRF
      RBAC_AUTH_COOKIE_PATH: /oo/api/auth/
      RBAC_AUTH_NAMESPACE: rbac1:oo:auth
    secrets:
      - source: oo_db_password
        target: db_password
      - redis_password
      - source: oo_jwt_private
        target: jwt_private
      - source: oo_jwt_public
        target: jwt_public

  mysql:
    image: ${RBAC_MYSQL_IMAGE:-mysql:8.4.7}
    networks: [app]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    volumes:
      - mysql-data:/var/lib/mysql
    secrets: [mysql_root_password, func_db_password, oo_db_password]
    configs:
      - source: mysql_init
        target: /docker-entrypoint-initdb.d/10-c2-databases.sh
        mode: 0555
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)" mysql --protocol=TCP -h127.0.0.1 -uroot -Nse "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    logging: *logging
    deploy:
      replicas: 1
      placement:
        constraints: ["node.hostname == ${RBAC_DATA_NODE:?Set RBAC_DATA_NODE}"]
      restart_policy:
        condition: on-failure

  redis:
    image: ${RBAC_REDIS_IMAGE:-redis:7.4.6-alpine}
    user: redis
    command: [sh, /run/configs/redis-start.sh]
    networks: [app]
    volumes:
      - redis-data:/data
    secrets: [redis_password]
    configs:
      - source: redis_start
        target: /run/configs/redis-start.sh
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 12
    logging: *logging
    deploy:
      replicas: 1
      placement:
        constraints: ["node.hostname == ${RBAC_DATA_NODE:?Set RBAC_DATA_NODE}"]
      restart_policy:
        condition: on-failure

networks:
  app:
    driver: overlay
volumes:
  mysql-data:
  redis-data:
configs:
  mysql_init:
    file: ./mysql-init.sh
    name: ${RBAC_STACK_NAME:-c2}_mysql_init_${RBAC_CONFIG_VERSION:-v1}
  redis_start:
    file: ./redis-start.sh
    name: ${RBAC_STACK_NAME:-c2}_redis_start_${RBAC_CONFIG_VERSION:-v1}
secrets:
  mysql_root_password:
    external: true
    name: ${RBAC_STACK_NAME:-c2}_mysql_root_password
  func_db_password:
    external: true
    name: ${RBAC_STACK_NAME:-c2}_func_db_password
  oo_db_password:
    external: true
    name: ${RBAC_STACK_NAME:-c2}_oo_db_password
  redis_password:
    external: true
    name: ${RBAC_STACK_NAME:-c2}_redis_password
  func_jwt_private:
    external: true
    name: ${RBAC_STACK_NAME:-c2}_func_jwt_private
  func_jwt_public:
    external: true
    name: ${RBAC_STACK_NAME:-c2}_func_jwt_public
  oo_jwt_private:
    external: true
    name: ${RBAC_STACK_NAME:-c2}_oo_jwt_private
  oo_jwt_public:
    external: true
    name: ${RBAC_STACK_NAME:-c2}_oo_jwt_public
