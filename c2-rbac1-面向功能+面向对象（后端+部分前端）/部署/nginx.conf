# 功能：共用静态前端与分版代理。Docker DNS 动态解析，后端重启换 IP 后可恢复。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 2m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /func { return 301 /func/; }
    location = /oo { return 301 /oo/; }

    # 优先匹配 API，错误仍由后端返回，不回退为 SPA 页面。
    location ^~ /func/api/ {
        set $backend backend-func:8080;
        rewrite ^/func(/api/.*)$ $1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location ^~ /oo/api/ {
        set $backend backend-oo:8080;
        rewrite ^/oo(/api/.*)$ $1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
